# Render Blueprint — lets Render create the web service + database
# together from this one file, instead of configuring each by hand.
# In the Render dashboard: New -> Blueprint -> point at this repo.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: newsletter-db
    plan: free

services:
  - type: web
    name: news-letter
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python seed_data.py"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: newsletter-db
          property: connectionString
